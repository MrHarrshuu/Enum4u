[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "enum4u"
version = "0.1.0"
description = "Unified security assessment framework"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

[project.scripts]
Enum4u = "enum4u.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["enum4u*"]